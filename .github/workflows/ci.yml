name: CI

# GitHub Actions syntax kept compatible with Forgejo Actions: no marketplace
# action without a Forgejo equivalent, every tool comes from mise.toml.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # weebo-operator-kit's checks: task lint, test:all, audit, lint:helm.
  checks:
    uses: batleforc/weebo-operator-kit/.github/workflows/checks.yml@v0.23.1
    permissions:
      contents: read
    with:
      test-task: "test:all"
      helm-task: "lint:helm"
      free-disk-space: false

  # Every layer — unit, contract, envtest, the binaries, and the live
  # suites against a real Forgejo (disposable container) — under coverage,
  # failing below 85% of lines (`task coverage`).
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          LIBCLANG_SO="$(find /usr/lib -iname 'libclang.so*' 2>/dev/null | head -n1)"
          if [ -z "$LIBCLANG_SO" ]; then
            echo "::error::libclang.so not found after installing libclang-dev" >&2
            exit 1
          fi
          {
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")"
            echo "BINDGEN_EXTRA_CLANG_ARGS="
          } >> "$GITHUB_ENV"
      - run: mise install
      - run: mise exec -- task forgejo:container:start ENGINE=docker
      - run: mise exec -- task coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lcov
          path: target/lcov.info
          if-no-files-found: ignore

  regen-and-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: mise install
      # Regenerates the Forgejo client (offline, from the vendored spec) and
      # the CRDs; both are committed and must never drift from their source.
      - run: mise exec -- task recu --force
      - name: Fail if committed generated files are stale
        run: |
          git diff --exit-code crates/forgejo-client/ deploy/crd/ \
            deploy/charts/weebo-forgejo/templates/crds/ docs/content/docs/crds/ docs/public/crd-schemas/ \
            docs/content/docs/reference/
          # A generated file that's new must be committed too.
          test -z "$(git status --porcelain crates/forgejo-client/ docs/content/docs/crds/ docs/public/crd-schemas/ docs/content/docs/reference/ deploy/)"

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: mise install
      - run: mise exec -- task docs:build

  image-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        file: [Containerfile, Containerfile.static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Build-only proof that both images build (no container engine in the
      # dev sandbox); publishing is publish.yml's job.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: weebo-forgejo-operator:ci
      # The image runs, not just builds (glibc ABI of each base).
      - run: docker run --rm --entrypoint /usr/local/bin/weebo-forgejo-importer weebo-forgejo-operator:ci --version
