name: E2E

# kind end to end (`task e2e`, deploy/e2e/run.sh): both operator images,
# installed by the Helm chart next to cert-manager and a disposable
# Forgejo, then the golden path, admission denials, leader failover and
# deletion policies. Weekly (and on demand): it builds release images.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: [Containerfile, Containerfile.hardened]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-mise
      - run: mise install
      - name: kind e2e
        env:
          CONTAINERFILE: ${{ matrix.file }}
        run: mise exec -- task e2e CONTAINERFILE="$CONTAINERFILE"
