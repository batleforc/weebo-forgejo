version: "3"

tasks:
  test:
    desc: "Fast unit + contract tests (lib-level, no cluster, no Forgejo)"
    cmds:
      # --no-fail-fast: one failing crate must not hide the others' results.
      - mise exec -- cargo test --workspace --lib --bins --no-fail-fast

  test:integration:
    desc: "Every test target, including integration tests under crates/*/tests"
    cmds:
      - mise exec -- cargo test --workspace --tests --no-fail-fast

  test:all:
    desc: "Every test suite: unit/contract + integration"
    cmds:
      - task: test
      - task: test:integration

  test:live-forgejo:
    desc: >
      Layer-4 tests against a real Forgejo (ignored by default): the HTTP
      gateway, then every controller end to end on envtest, then an
      importer round trip. Needs
      FORGEJO_URL and FORGEJO_TOKEN (site-admin, all scopes); in Che,
      `task forgejo:start forgejo:bootstrap` provides both for
      http://localhost:3000. FORGEJO_SOURCE_ID optionally covers external
      users.
    requires:
      vars: [FORGEJO_URL, FORGEJO_TOKEN]
    env:
      FORGEJO_URL: "{{.FORGEJO_URL}}"
      FORGEJO_TOKEN: "{{.FORGEJO_TOKEN}}"
    cmds:
      - mise exec -- cargo test -p adapters-outbound --test live_forgejo -- --ignored
      - mise exec -- cargo test -p adapters-inbound --test live_forgejo -- --ignored
      - mise exec -- cargo test -p importer --test live_forgejo -- --ignored
      - mise exec -- cargo test -p adapters-inbound --test live_identities --test live_repositories --test live_credentials -- --ignored

  coverage:
    desc: >
      Line coverage of every test layer (unit, contract, envtest, binaries,
      and the live suites against a real Forgejo), failing under 85%.
      Needs FORGEJO_URL/FORGEJO_TOKEN/FORGEJO_SOURCE_ID — exported, or read
      from .forgejo-test.env (`task forgejo:container:start`). Excluded:
      the generated forgejo-client and the test harnesses themselves.
      Writes target/lcov.info.
    vars:
      IGNORE: '(forgejo-client|testkit|test_support|/tests/)'
    cmds:
      - |
        set -a; [ -f .forgejo-test.env ] && . ./.forgejo-test.env; set +a
        : "${FORGEJO_URL:?run task forgejo:container:start or export FORGEJO_URL}"
        mise exec -- cargo llvm-cov clean --workspace
        # --include-ignored: the live suites are #[ignore] for `task test`.
        mise exec -- cargo llvm-cov --no-report --workspace --all-targets --no-fail-fast -- --include-ignored
        mise exec -- cargo llvm-cov report --ignore-filename-regex '{{.IGNORE}}' --lcov --output-path target/lcov.info
        mise exec -- cargo llvm-cov report --ignore-filename-regex '{{.IGNORE}}' --summary-only --fail-under-lines 85

  perf:
    desc: >
      What the operator costs a cluster (weebo-kit-perf): the release binary
      against envtest and a fake Forgejo — idle, burst, churn, delete —
      checked against the small-cluster budget; report in target/perf/.
      PERF_OBJECTS, PERF_IDLE_SECS; WEEBO_PERF_BASELINE=<previous json>;
      WEEBO_PERF_REPORT_ONLY=1 to report without failing.
    cmds:
      - mise exec -- cargo test --release -p operator --test perf -- --ignored --nocapture
