[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/application",
    "crates/adapters-outbound",
    "crates/adapters-inbound",
    "crates/forgejo-client",
    "crates/operator",
    "crates/crdgen",
    "crates/importer",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/batleforc/weebo-forgejo"

[workspace.dependencies]
domain = { path = "crates/domain" }
api = { path = "crates/api" }
application = { path = "crates/application" }
adapters-outbound = { path = "crates/adapters-outbound" }
adapters-inbound = { path = "crates/adapters-inbound" }
forgejo-client = { path = "crates/forgejo-client" }
testkit = { path = "crates/testkit" }

# Shared operator kit. To iterate on it locally, temporarily swap the
# `git`/`tag` pair for `path = "../weebo-operator-kit/crates/<crate>"` —
# never push with a path dependency (CI and container builds don't see it).
weebo-kit-domain = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }
weebo-kit-api = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }
weebo-kit-application = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }
weebo-kit-adapters = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }
weebo-kit-runtime = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }
weebo-kit-testkit = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }
weebo-kit-perf = { git = "https://github.com/batleforc/weebo-operator-kit", tag = "v0.6.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "4.0", features = ["derive", "runtime", "client", "unstable-runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
schemars = "1.2"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
rustls = { version = "0.23", features = ["ring"] }
wiremock = "0.6"
vaultrs = "0.8"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics"] }
tracing-opentelemetry = "0.34"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
envtest = "0.3"

# Debug info on test binaries balloons target/ across this many crates
# (envtest alone links kube-apiserver/etcd).
[profile.test]
debug = false
