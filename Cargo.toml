[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/application",
    "crates/adapters-outbound",
    "crates/adapters-inbound",
    "crates/forgejo-client",
    "crates/operator",
    "crates/crdgen",
    "crates/importer",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/batleforc/weebo-forgejo"

[workspace.dependencies]
domain = { path = "crates/domain" }
api = { path = "crates/api" }
application = { path = "crates/application" }
adapters-outbound = { path = "crates/adapters-outbound" }
adapters-inbound = { path = "crates/adapters-inbound" }
forgejo-client = { path = "crates/forgejo-client" }
testkit = { path = "crates/testkit" }

# Shared operator kit (github.com/batleforc/weebo-operator-kit). A path
# dependency on a sibling checkout until the kit is published; then
# `{ git = "https://github.com/batleforc/weebo-operator-kit", tag = "vX.Y.Z" }`.
weebo-kit-domain = { path = "../weebo-operator-kit/crates/weebo-kit-domain" }
weebo-kit-api = { path = "../weebo-operator-kit/crates/weebo-kit-api" }
weebo-kit-application = { path = "../weebo-operator-kit/crates/weebo-kit-application" }
weebo-kit-adapters = { path = "../weebo-operator-kit/crates/weebo-kit-adapters" }
weebo-kit-runtime = { path = "../weebo-operator-kit/crates/weebo-kit-runtime" }
weebo-kit-testkit = { path = "../weebo-operator-kit/crates/weebo-kit-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "4.0", features = ["derive", "runtime", "client"] }
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
schemars = "1.2"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
rustls = { version = "0.23", features = ["ring"] }
wiremock = "0.6"
vaultrs = "0.8"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
tracing-opentelemetry = "0.33"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
kube-leader-election = "0.44"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
envtest = "0.3"

# Debug info on test binaries balloons target/ across this many crates
# (envtest alone links kube-apiserver/etcd).
[profile.test]
debug = false
