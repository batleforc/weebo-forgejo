version: "3"

includes:
  mise: ./.tasks/mise.yaml
  claude: ./.tasks/claude.yaml
  template: ./.tasks/template.yaml
  # cog.toml, rendered from weebo-operator-kit's template (task kit:cog).
  kit: ./.tasks/kit.yaml
  gen: ./.tasks/gen.yaml
  forgejo: ./.tasks/forgejo.yaml
  e2e: ./.tasks/e2e.yaml
  # weebo-operator-kit's shared tasks, pinned to the kit tag of Cargo.toml
  # and to their sha256: `task kit:sync` rewrites both. `task --offline`
  # runs from Task's cache.
  rust:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.13.0/tasks/rust.yaml
    checksum: 75360142235715643265ae41de1f531dda6562a2472e8d9af21ad65f7d753d63
    vars:
      # The generated forgejo-client and the test harnesses themselves.
      COVERAGE_IGNORE: '(forgejo-client|testkit|test_support|/tests/)'
      # Live-test credentials (`task forgejo:container:start`).
      COVERAGE_ENV_FILE: .forgejo-test.env
      COVERAGE_REQUIRE_ENV: FORGEJO_URL
  repo:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.13.0/tasks/repo.yaml
    checksum: 162d15bf9c41f494efcb6d73e089ac685d23bc98269a41daf62db26534f52f72
    vars:
      CONTAINERFILES: Containerfile Containerfile.static
      NPM_DIR: docs
  helm:
    taskfile: https://raw.githubusercontent.com/batleforc/weebo-operator-kit/v0.13.0/tasks/helm.yaml
    checksum: e3d0c9ef0c9d5ae970396a38214bba4dabd6cb2c141613db3844f360c08dab56
    vars:
      CHART: deploy/charts/weebo-forgejo
  tests:
    taskfile: ./.tasks/test.yaml
    flatten: true

# `crates/testkit` builds the `envtest` crate, whose bindgen step needs a
# real libclang.so and the C headers (crates/testkit/src/envtest.rs).
# Defaults match Fedora's clang-libs + gcc; an exported value wins, even an
# empty one (CI on Ubuntu sets BINDGEN_EXTRA_CLANG_ARGS="" — libclang-dev
# finds its own headers there).
env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  init:
    desc: "Init folder"
    cmds:
      - task mise:install
      - task claude:install
      - cog install-hook -a -o

  doctor:
    desc: "Check the local dev setup needed by envtest (Go, libclang, control-plane binaries) and the git hooks"
    cmds:
      - task: rust:doctor

  recu:
    desc: "Regenerate every committed artifact: the Forgejo client (offline, from the vendored spec) and the CRDs"
    cmds:
      - task: gen:client
      - mise exec -- cargo run -q -p crdgen -- --out deploy/crd/
      # The chart ships the CRDs as templates (Helm never upgrades crds/),
      # wrapped in `crds.install` + `helm.sh/resource-policy: keep`.
      - task: helm:crds
      # CRD reference pages + form schemas of the docs site, and its operator
      # reference (reason codes and metrics read from crates/, the budget from
      # docs/perf/): weebo-crd-docs (@weebo/operator-docs) reads
      # docs/crd-docs.config.mjs and clears its own previous outputs.
      - task: docs:deps
      - mise exec -- npm run gen:crds --prefix docs --silent

  lint:
    desc: "cargo fmt --check + clippy -D warnings on the whole workspace, hadolint on both Containerfiles, actionlint on CI"
    cmds:
      - task: rust:lint
      - task: repo:lint

  docs:deps:
    desc: "Install the docs site's npm dependencies (from the lockfile) when missing"
    status:
      - test -d docs/node_modules
    cmds:
      - mise exec -- npm ci --prefix docs --no-fund

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run dev

  docs:build:
    desc: "Production build + lint of the documentation site"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run lint
      - mise exec -- npm run build

  lint:helm:
    desc: "helm lint + smoke renders of the operator chart (the kit's value combinations and refusals)"
    cmds:
      - task: helm:lint

  audit:
    desc: "Check dependencies and Containerfiles for CVE (cargo-deny + trivy, npm audit on the docs site, trivy config)"
    cmds:
      # advisories (RUSTSEC, yanked, unmaintained), licenses and sources —
      # see deny.toml — then trivy on Cargo.lock as a second opinion.
      - task: rust:audit
      # The docs site's shipped dependencies, and misconfigurations in both
      # images' build files. Image *contents* need a built image: see the
      # CI publish workflow, which scans what it pushes.
      - task: repo:audit
