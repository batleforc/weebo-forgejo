version: "3"

includes:
  mise: ./.tasks/mise.yaml
  claude: ./.tasks/claude.yaml
  template: ./.tasks/template.yaml
  # cog.toml, rendered from weebo-operator-kit's template (task kit:cog).
  kit: ./.tasks/kit.yaml
  gen: ./.tasks/gen.yaml
  forgejo: ./.tasks/forgejo.yaml
  e2e: ./.tasks/e2e.yaml
  helm: ./.tasks/helm.yaml
  tests:
    taskfile: ./.tasks/test.yaml
    flatten: true

# `crates/testkit` builds the `envtest` crate, whose bindgen step needs a
# real libclang.so and the C headers (crates/testkit/src/envtest.rs).
# Defaults match Fedora's clang-libs + gcc; an exported value wins, even an
# empty one (CI on Ubuntu sets BINDGEN_EXTRA_CLANG_ARGS="" — libclang-dev
# finds its own headers there).
env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  init:
    desc: "Init folder"
    cmds:
      - task mise:install
      - task claude:install
      - cog install-hook -a -o

  doctor:
    desc: "Check the local dev setup needed by envtest (Go, libclang, control-plane binaries) and the git hooks"
    cmds:
      - |
        ok=true
        check() { if eval "$2" >/dev/null 2>&1; then echo "  [ok]   $1"; else echo "  [FAIL] $1 — $3"; ok=false; fi; }
        check "go"              "mise exec -- go version"                    "mise install"
        check "etcd"            "mise exec -- etcd --version"                "mise install"
        check "kube-apiserver"  "mise exec -- kube-apiserver --version"      "mise install"
        check "libclang.so"     "ls $LIBCLANG_PATH/libclang.so*"             "install clang-libs (or libclang-dev) and set LIBCLANG_PATH"
        test -f .git/hooks/pre-commit && echo "  [ok]   git hooks" || echo "  [warn] git hooks not installed — task init"
        $ok

  recu:
    desc: "Regenerate every committed artifact: the Forgejo client (offline, from the vendored spec) and the CRDs"
    cmds:
      - task: gen:client
      - mise exec -- cargo run -q -p crdgen -- --out deploy/crd/
      # The chart ships the CRDs as templates (Helm never upgrades crds/),
      # wrapped in `crds.install` + `helm.sh/resource-policy: keep`.
      - deploy/scripts/sync-chart-crds.sh
      # CRD reference pages + form schemas of the docs site, and its operator
      # reference (reason codes and metrics read from crates/, the budget from
      # docs/perf/): weebo-crd-docs (@weebo/operator-docs) reads
      # docs/crd-docs.config.mjs and clears its own previous outputs.
      - task: docs:deps
      - mise exec -- npm run gen:crds --prefix docs --silent

  lint:
    desc: "cargo fmt --check + clippy -D warnings on the whole workspace, hadolint on both Containerfiles, actionlint on CI"
    cmds:
      - mise exec -- cargo fmt --check
      - mise exec -- cargo clippy --workspace --all-targets -- -D warnings
      - mise exec -- hadolint Containerfile Containerfile.hardened
      - mise exec -- actionlint

  docs:deps:
    desc: "Install the docs site's npm dependencies (from the lockfile) when missing"
    status:
      - test -d docs/node_modules
    cmds:
      - mise exec -- npm ci --prefix docs --no-fund

  docs:
    desc: "Run the Fumadocs documentation site in dev mode (http://localhost:3000)"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run dev

  docs:build:
    desc: "Production build + lint of the documentation site"
    deps: [docs:deps]
    dir: docs
    cmds:
      - mise exec -- npm run lint
      - mise exec -- npm run build

  lint:helm:
    desc: "helm lint + template smoke renders of the operator chart (see .tasks/helm.yaml)"
    cmds:
      - task: helm:lint
      - task: helm:smoke

  audit:
    desc: "Check dependencies and Containerfiles for CVE (cargo-deny + trivy)"
    cmds:
      # advisories (RUSTSEC, yanked, unmaintained), licenses and sources —
      # see deny.toml.
      - mise exec -- cargo deny check
      # Lockfile CVEs from trivy's own DB, as a second opinion on cargo-deny.
      - mise exec -- trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL Cargo.lock
      # The docs site's shipped dependencies. Dev tooling is excluded: its
      # only finding (braces <=3.0.3 via eslint-config-next) has no fixed
      # release yet and never reaches the built site.
      - task: docs:deps
      - mise exec -- npm audit --prefix docs --omit=dev --audit-level=high
      # Misconfigurations in both images' build files (root user, unpinned
      # bases, ...). Image *contents* need a built image: see the CI publish
      # workflow, which scans what it pushes.
      - mise exec -- trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --skip-dirs docs/node_modules --skip-dirs target --file-patterns 'dockerfile:Containerfile.*' .
