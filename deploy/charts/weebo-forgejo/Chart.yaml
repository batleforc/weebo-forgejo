apiVersion: v2
name: weebo-forgejo
description: Kubernetes operator managing Forgejo users, organizations, teams, repositories, webhooks, keys, OAuth2 applications and access tokens as CRDs.
type: application
version: 0.5.0
appVersion: "0.5.0"
# Native `preStop: sleep` and the admission/policy APIs used here.
kubeVersion: ">=1.30.0-0"
home: https://batleforc.github.io/weebo-forgejo
# The documentation site's icon (docs/src/app/icon.png).
icon: https://batleforc.github.io/weebo-forgejo/icon.png
sources:
  - https://github.com/batleforc/weebo-forgejo
keywords:
  - forgejo
  - gitea
  - git
  - operator
  - kubernetes-operator
  - gitops
  - crd
maintainers:
  - name: batleforc
    url: https://github.com/batleforc
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/links: |
    - name: Documentation
      url: https://batleforc.github.io/weebo-forgejo
    - name: Source
      url: https://github.com/batleforc/weebo-forgejo
dependencies:
  # Every resource but the CRDs (templates/operator.yaml); its version is
  # the kit's, as in Cargo.toml (`task kit:sync` keeps them in step).
  - name: weebo-operator-lib
    version: 0.18.2
    repository: oci://ghcr.io/batleforc/charts
