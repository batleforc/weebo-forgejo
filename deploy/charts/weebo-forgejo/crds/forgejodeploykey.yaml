apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejodeploykeys.forgejo.weebo.io
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoDeployKey
    plural: forgejodeploykeys
    shortNames:
    - fjdkey
    singular: forgejodeploykey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repositoryRef.name
      name: Repository
      type: string
    - jsonPath: .spec.readOnly
      name: ReadOnly
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoDeployKeySpec via `CustomResource`
        properties:
          spec:
            description: |-
              An SSH deploy key on a `ForgejoRepository` (same namespace). Without
              `publicKey`, the operator generates an ed25519 pair and writes the
              private half to `secretTargets` (`ssh-privatekey`, `ssh-publickey` — the
              `kubernetes.io/ssh-auth` key names). Keys are immutable in Forgejo: any
              change recreates the key.
            properties:
              deletionPolicy:
                default: Delete
                description: What happens to the Forgejo object when its CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              instanceRef:
                nullable: true
                type: string
              publicKey:
                description: |-
                  An OpenSSH public key (`ssh-ed25519 AAAA... comment`). Unset: the
                  operator generates an ed25519 pair.
                nullable: true
                type: string
              readOnly:
                default: true
                type: boolean
              repositoryRef:
                description: |-
                  Reference to another CR of this operator, by `metadata.name`. Always a
                  CR, never a raw Forgejo name (see `.prompt/plan.md`, "Références"): a
                  cluster-scoped target is looked up cluster-wide, a namespaced one in the
                  referencing CR's own namespace only.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              secretTargets:
                description: |-
                  Destinations of a generated private key. Required when `publicKey`
                  is unset; a target that disappears (or a new
                  `forgejo.weebo.io/rotate-secret` nonce) generates a fresh pair.
                items:
                  description: |-
                    Where an emitted secret (generated password or key, OAuth2 credentials,
                    access token) is written. A CR may list several targets — the same
                    value is fanned out to each.
                  properties:
                    backend:
                      default: kubernetes
                      description: |-
                        `kubernetes` (default) or `vault`. A Vault target reuses the
                        connection (address, mount, auth) of the `ForgejoInstance`'s
                        `secretStore.vault`, which must then be set.
                      enum:
                      - kubernetes
                      - vault
                      type: string
                    name:
                      description: |-
                        Kubernetes: the `Secret` name. Vault: names the default path
                        `<pathPrefix>/<namespace>/<name>` when `path` is unset.
                      type: string
                    namespace:
                      description: |-
                        Kubernetes `Secret` namespace (Vault: the namespace segment of the
                        default path). Defaults to the CR's own namespace; required on
                        cluster-scoped CRs.
                      nullable: true
                      type: string
                    path:
                      description: 'Vault only: explicit KV v2 path under the instance''s mount.'
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                type: array
              title:
                description: Defaults to the CR name.
                nullable: true
                type: string
            required:
            - repositoryRef
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: |-
                        One of `domain::error::ReasonCode`'s `as_str()` values — never a
                        hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation (or the
                  RFC 3339 time, for `rotationPeriod`) the last secret was issued
                  for. Only used by kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: ForgejoDeployKey
        type: object
    served: true
    storage: true
    subresources:
      status: {}
