apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejoteams.forgejo.weebo.io
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoTeam
    plural: forgejoteams
    shortNames:
    - fjteam
    singular: forgejoteam
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.organizationRef.name
      name: Organization
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .status.forgejoId
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoTeamSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A team inside a `ForgejoOrganization`, with its members. Repositories
              grant themselves access to it through `ForgejoRepository.spec.teamRefs`.
            properties:
              canCreateOrgRepo:
                default: false
                type: boolean
              deletionPolicy:
                default: Delete
                description: What happens to the Forgejo object when its CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                nullable: true
                type: string
              includesAllRepositories:
                default: false
                description: |-
                  Grant access to every repository of the organization, current and
                  future.
                type: boolean
              instanceRef:
                nullable: true
                type: string
              memberRefs:
                description: |-
                  `ForgejoUser`s in the team. The member list is authoritative:
                  anyone else is removed. A member whose user doesn't exist in Forgejo
                  yet (e.g. an observed OIDC user who never logged in) is reported as
                  `MemberPending` while the others are synced.
                items:
                  description: |-
                    Reference to another CR of this operator, by `metadata.name`. Always a
                    CR, never a raw Forgejo name: a cluster-scoped target is looked up
                    cluster-wide, a namespaced one in the referencing CR's own namespace only.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              name:
                description: Team name, unique within the organization. `Owners` is reserved.
                type: string
              organizationRef:
                description: |-
                  `ForgejoOrganization` the team belongs to. A team can't move between
                  organizations: changing this deletes and recreates it, which needs
                  the `forgejo.weebo.io/allow-disruptive-update: "true"` annotation.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              permission:
                default: read
                enum:
                - read
                - write
                - admin
                type: string
              unitsMap:
                additionalProperties:
                  type: string
                description: |-
                  Per-unit access (`repo.code`, `repo.issues`, `repo.pulls`,
                  `repo.releases`, `repo.wiki`, `repo.packages`, `repo.actions`, ...)
                  to `none`, `read`, `write` or `admin`. Empty means every repository
                  unit at `permission` (Forgejo refuses a team without units). Ignored
                  by Forgejo when `permission` is `admin`.
                type: object
            required:
            - name
            - organizationRef
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: |-
                        One of `domain::error::ReasonCode`'s `as_str()` values — never a
                        hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation the last
                  secret was issued for, so the same nonce never rotates twice. Only
                  used by kinds that emit a secret (a `rotationPeriod` renewal shows
                  as a new `forgejoId` instead).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              ownerId:
                description: |-
                  Forgejo id of the account owning the object (an access token's
                  user, an OAuth2 application's owner), so a renamed owner isn't
                  mistaken for a different one.
                nullable: true
                type: string
              secretPending:
                description: |-
                  A secret (token, client secret, password) was issued in Forgejo but
                  not written to every target: the targets may hold a revoked value,
                  so the next reconcile issues a new one instead of trusting them.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: ForgejoTeam
        type: object
    served: true
    storage: true
    subresources:
      status: {}
