{{- $kinds := list "forgejoinstances" "forgejousers" "forgejouserkeys" "forgejoorganizations" "forgejoteams" "forgejorepositories" "forgejowebhooks" "forgejodeploykeys" "forgejooauth2applications" "forgejoaccesstokens" "forgejonamespacepolicies" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "weebo-forgejo.fullname" . }}
  labels:
    {{- include "weebo-forgejo.labels" . | nindent 4 }}
rules:
  # Every controller watches its kind cluster-wide (namespaced kinds
  # included) and the kinds it references.
  - apiGroups: ["forgejo.weebo.io"]
    resources:
      {{- range $kinds }}
      - {{ . }}
      {{- end }}
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["forgejo.weebo.io"]
    resources:
      {{- range $kinds }}
      - {{ . }}/status
      {{- end }}
    verbs: ["get", "patch", "update"]
  - apiGroups: ["forgejo.weebo.io"]
    resources:
      {{- range $kinds }}
      - {{ . }}/finalizers
      {{- end }}
    verbs: ["update"]
  # Emitted credentials (any namespace a CR targets), the ForgejoInstance
  # token, webhook secrets and migration credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kubernetes Events on every Ready transition.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
