{{- if .Values.crds.install }}
# Generated by `task recu` from deploy/crd/forgejoorganization.yaml: do not edit.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejoorganizations.forgejo.weebo.io
  labels:
    {{- include "weebo-forgejo.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: that would delete every CR.
    helm.sh/resource-policy: keep
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoOrganization
    plural: forgejoorganizations
    shortNames:
    - fjorg
    singular: forgejoorganization
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .status.forgejoId
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoOrganizationSpec via `CustomResource`
        properties:
          spec:
            description: A Forgejo organization.
            properties:
              deletionPolicy:
                default: Orphan
                description: |-
                  Defaults to `Orphan`: deleting the CR never deletes the
                  organization (Forgejo also refuses while it still owns repos).
                enum:
                - Delete
                - Orphan
                type: string
              description:
                nullable: true
                type: string
              email:
                nullable: true
                type: string
              fullName:
                nullable: true
                type: string
              instanceRef:
                nullable: true
                type: string
              location:
                nullable: true
                type: string
              name:
                description: Organization name (its URL slug). Changing it renames in place.
                type: string
              ownerRef:
                description: |-
                  `ForgejoUser` that becomes the organization's first owner. Only read
                  at creation; without it the operator's admin account owns it.
                nullable: true
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              repoAdminChangeTeamAccess:
                default: false
                description: Let repository admins change which teams can access their repo.
                type: boolean
              visibility:
                default: public
                description: Visibility of a Forgejo user or organization.
                enum:
                - public
                - private
                - limited
                type: string
              website:
                nullable: true
                type: string
            required:
            - name
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation the last
                  secret was issued for, so the same nonce never rotates twice. Only
                  used by kinds that emit a secret (a `rotationPeriod` renewal shows
                  as a new `forgejoId` instead).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              ownerId:
                description: |-
                  Forgejo id of the account owning the object (an access token's
                  user, an OAuth2 application's owner), so a renamed owner isn't
                  mistaken for a different one.
                nullable: true
                type: string
              secretPending:
                description: |-
                  A secret (token, client secret, password) was issued in Forgejo but
                  not written to every target: the targets may hold a revoked value,
                  so the next reconcile issues a new one instead of trusting them.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: ForgejoOrganization
        type: object
        x-kubernetes-validations:
        - message: 'spec.instanceRef is immutable: ids in status belong to the instance they were created on'
          reason: FieldValueForbidden
          rule: '(has(self.spec.instanceRef) ? self.spec.instanceRef : '''') == (has(oldSelf.spec.instanceRef) ? oldSelf.spec.instanceRef : '''')'
    served: true
    storage: true
    subresources:
      status: {}
