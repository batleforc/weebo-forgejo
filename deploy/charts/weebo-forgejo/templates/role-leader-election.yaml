# Leader election: a single Lease in the release namespace (POD_NAMESPACE),
# hence a namespaced Role rather than cluster-wide Lease write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "weebo-forgejo.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-forgejo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "weebo-forgejo.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weebo-forgejo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "weebo-forgejo.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "weebo-forgejo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
