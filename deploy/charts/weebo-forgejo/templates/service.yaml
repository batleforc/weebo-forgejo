apiVersion: v1
kind: Service
metadata:
  name: {{ include "weebo-forgejo.fullname" . }}
  labels:
    {{- include "weebo-forgejo.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  selector:
    {{- include "weebo-forgejo.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: {{ .Values.webhook.servicePort }}
      targetPort: webhook
      protocol: TCP
