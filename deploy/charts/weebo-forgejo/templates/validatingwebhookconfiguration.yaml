apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "weebo-forgejo.fullname" . }}
  labels:
    {{- include "weebo-forgejo.labels" . | nindent 4 }}
  {{- if or .Values.webhook.certManager.enabled .Values.webhook.annotations }}
  annotations:
    {{- if .Values.webhook.certManager.enabled }}
    # cert-manager's CA injector fills caBundle from the Certificate.
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "weebo-forgejo.fullname" . }}-webhook
    {{- end }}
    {{- with .Values.webhook.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
webhooks:
  - name: validate.forgejo.weebo.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    matchPolicy: Equivalent
    {{- with .Values.webhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.webhook.objectSelector }}
    objectSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    clientConfig:
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ required "webhook.caBundle (base64 PEM of the CA that signed webhook.tls.secretName) is required when webhook.certManager.enabled is false" .Values.webhook.caBundle }}
      {{- end }}
      service:
        name: {{ include "weebo-forgejo.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: {{ .Values.webhook.servicePort }}
    rules:
      # CREATE/UPDATE only, never DELETE: revoking a namespace's access must
      # never block the finalizer cleanup of what it already created. The
      # finalizer removal itself is an UPDATE, so the webhook lets through
      # any UPDATE of an object that is already terminating
      # (deletionTimestamp set).
      - apiGroups: ["forgejo.weebo.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - forgejorepositories
          - forgejowebhooks
          - forgejodeploykeys
          - forgejooauth2applications
          - forgejoaccesstokens
