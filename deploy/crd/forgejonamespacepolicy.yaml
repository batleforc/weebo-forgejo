apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejonamespacepolicies.forgejo.weebo.io
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoNamespacePolicy
    plural: forgejonamespacepolicies
    shortNames:
    - fjnp
    singular: forgejonamespacepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoNamespacePolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Namespace allow-list for the namespaced kinds, enforced by the
              admission webhook (CREATE/UPDATE) and re-checked by every reconciler.

              While no `ForgejoNamespacePolicy` exists, everything is allowed. As soon
              as one exists, a namespaced CR is only accepted if some `Allow` rule
              matches its namespace and kind and covers the organizations and users it
              references — and no `Deny` rule matches. Rules of every policy are
              pooled; deny always wins.
            properties:
              rules:
                items:
                  properties:
                    allowedKinds:
                      items:
                        enum:
                        - ForgejoRepository
                        - ForgejoWebhook
                        - ForgejoDeployKey
                        - ForgejoOAuth2Application
                        - ForgejoAccessToken
                        type: string
                      type: array
                    allowedOrganizations:
                      description: |-
                        `ForgejoOrganization`s (CR names) the namespace may reference —
                        owner of its repositories, target of its org webhooks. Unset: any.
                        On a `Deny` rule: only deny requests referencing one of these.
                      items:
                        type: string
                      nullable: true
                      type: array
                    allowedUsers:
                      description: |-
                        `ForgejoUser`s (CR names) the namespace may reference — owner of a
                        repository or OAuth2 application, holder of an access token. Unset:
                        any. Restricting this is what stops a namespace from minting tokens
                        for a privileged account. On a `Deny` rule: only deny requests
                        referencing one of these.
                      items:
                        type: string
                      nullable: true
                      type: array
                    effect:
                      default: Allow
                      enum:
                      - Allow
                      - Deny
                      type: string
                    namespaces:
                      description: Namespace names, `*` for all, or a prefix glob like `team-*`.
                      items:
                        type: string
                      type: array
                  required:
                  - allowedKinds
                  - namespaces
                  type: object
                type: array
            required:
            - rules
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: |-
                        One of `domain::error::ReasonCode`'s `as_str()` values — never a
                        hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation the last
                  secret was issued for, so the same nonce never rotates twice. Only
                  used by kinds that emit a secret (a `rotationPeriod` renewal shows
                  as a new `forgejoId` instead).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: ForgejoNamespacePolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
