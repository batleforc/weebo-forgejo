apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejooauth2applications.forgejo.weebo.io
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoOAuth2Application
    plural: forgejooauth2applications
    shortNames:
    - fjoauth
    singular: forgejooauth2application
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.forgejoName
      name: Owner
      type: string
    - jsonPath: .status.forgejoId
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoOAuth2ApplicationSpec via `CustomResource`
        properties:
          spec:
            description: |-
              An OAuth2 application registered in Forgejo, for apps that use Forgejo
              as their identity provider. Its credentials (`FORGEJO_CLIENT_ID`,
              `FORGEJO_CLIENT_SECRET`, `FORGEJO_URL` — the OIDC issuer) are written to
              `secretTargets`.

              Forgejo regenerates the client secret on every update and never returns
              it again, so the application is only updated when the spec actually
              differs, when a target lost the secret, or on a new
              `forgejo.weebo.io/rotate-secret` nonce.
            properties:
              confidentialClient:
                default: true
                description: |-
                  Confidential clients authenticate with their secret; public clients
                  (SPAs, CLIs) use PKCE only.
                type: boolean
              deletionPolicy:
                default: Delete
                description: What happens to the Forgejo object when its CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              instanceRef:
                nullable: true
                type: string
              name:
                description: Display name. Defaults to the CR name.
                nullable: true
                type: string
              ownerRef:
                description: |-
                  `ForgejoUser` owning the application (typically a `bot`) — the
                  operator acts as that user through Forgejo's `Sudo` header. Unset:
                  the operator's admin account. Changing it recreates the application
                  (new client id), which needs the
                  `forgejo.weebo.io/allow-disruptive-update: "true"` annotation.
                nullable: true
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              redirectUris:
                items:
                  type: string
                type: array
              secretTargets:
                description: |-
                  Defaults to one target named after the CR, in its namespace, on the
                  instance's default `secretStore` backend.
                items:
                  description: |-
                    Where an emitted secret (generated password or key, OAuth2 credentials,
                    access token) is written. A CR may list several targets — the same
                    value is fanned out to each.
                  properties:
                    backend:
                      default: kubernetes
                      description: |-
                        `kubernetes` (default) or `vault`. A Vault target reuses the
                        connection (address, mount, auth) of the `ForgejoInstance`'s
                        `secretStore.vault`, which must then be set.
                      enum:
                      - kubernetes
                      - vault
                      type: string
                    name:
                      description: |-
                        Kubernetes: the `Secret` name. Vault: names the default path
                        `<pathPrefix>/<namespace>/<name>` when `path` is unset.
                      type: string
                    namespace:
                      description: |-
                        Kubernetes `Secret` namespace (Vault: the namespace segment of the
                        default path). Defaults to the CR's own namespace; required on
                        cluster-scoped CRs.
                      nullable: true
                      type: string
                    path:
                      description: 'Vault only: explicit KV v2 path under the instance''s mount.'
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                type: array
            required:
            - redirectUris
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: |-
                        One of `domain::error::ReasonCode`'s `as_str()` values — never a
                        hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation the last
                  secret was issued for, so the same nonce never rotates twice. Only
                  used by kinds that emit a secret (a `rotationPeriod` renewal shows
                  as a new `forgejoId` instead).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              ownerId:
                description: |-
                  Forgejo id of the account owning the object (an access token's
                  user, an OAuth2 application's owner), so a renamed owner isn't
                  mistaken for a different one.
                nullable: true
                type: string
              secretPending:
                description: |-
                  A secret (token, client secret, password) was issued in Forgejo but
                  not written to every target: the targets may hold a revoked value,
                  so the next reconcile issues a new one instead of trusting them.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: ForgejoOAuth2Application
        type: object
    served: true
    storage: true
    subresources:
      status: {}
