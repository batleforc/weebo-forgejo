apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejorepositories.forgejo.weebo.io
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoRepository
    plural: forgejorepositories
    shortNames:
    - fjrepo
    singular: forgejorepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.forgejoName
      name: Repository
      type: string
    - jsonPath: .status.forgejoId
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoRepositorySpec via `CustomResource`
        properties:
          spec:
            description: |-
              A Forgejo repository, owned by a `ForgejoOrganization` or a
              `ForgejoUser`. Created empty (optionally initialized), from a template
              repository, or by migrating/mirroring a remote.

              Exactly one of `organizationRef`/`userRef`, and at most one of
              `init`/`fromTemplate`/`migrate` — checked by the reconciler
              (`InvalidSpec`), since kube's schema can't express one-of.
            properties:
              archived:
                default: false
                description: |-
                  Archived repositories are read-only; their settings, branch
                  protections and teams are left alone until unarchived.
                type: boolean
              branchProtections:
                description: |-
                  Branch protection rules. Authoritative: a rule not listed here is
                  deleted.
                items:
                  description: |-
                    One branch protection rule. Allow-lists name Forgejo users and teams
                    directly (not CRs); each `enable*Whitelist` switch is derived from
                    whether its lists are non-empty.
                  properties:
                    applyToAdmins:
                      default: false
                      type: boolean
                    approvalsWhitelistTeams:
                      items:
                        type: string
                      type: array
                    approvalsWhitelistUsernames:
                      items:
                        type: string
                      type: array
                    blockOnOfficialReviewRequests:
                      default: false
                      type: boolean
                    blockOnOutdatedBranch:
                      default: false
                      type: boolean
                    blockOnRejectedReviews:
                      default: false
                      type: boolean
                    dismissStaleApprovals:
                      default: false
                      type: boolean
                    enablePush:
                      default: false
                      description: Allow pushing at all; with push allow-lists, only those may push.
                      type: boolean
                    ignoreStaleApprovals:
                      default: false
                      type: boolean
                    mergeWhitelistTeams:
                      items:
                        type: string
                      type: array
                    mergeWhitelistUsernames:
                      items:
                        type: string
                      type: array
                    protectedFilePatterns:
                      nullable: true
                      type: string
                    pushWhitelistDeployKeys:
                      default: false
                      type: boolean
                    pushWhitelistTeams:
                      items:
                        type: string
                      type: array
                    pushWhitelistUsernames:
                      items:
                        type: string
                      type: array
                    requireSignedCommits:
                      default: false
                      type: boolean
                    requiredApprovals:
                      default: 0
                      format: int64
                      type: integer
                    ruleName:
                      description: Branch name or glob (`main`, `release/*`).
                      type: string
                    statusCheckContexts:
                      description: Required status checks; enables the check when non-empty.
                      items:
                        type: string
                      type: array
                    unprotectedFilePatterns:
                      nullable: true
                      type: string
                  required:
                  - ruleName
                  type: object
                type: array
              defaultBranch:
                nullable: true
                type: string
              deletionPolicy:
                default: Orphan
                description: 'Defaults to `Orphan`: deleting the CR never deletes git history.'
                enum:
                - Delete
                - Orphan
                type: string
              description:
                nullable: true
                type: string
              fromTemplate:
                description: |-
                  Generate the repository from a template `ForgejoRepository` in the
                  same namespace. Creation-time only.
                nullable: true
                properties:
                  avatar:
                    default: false
                    type: boolean
                  gitContent:
                    default: true
                    type: boolean
                  gitHooks:
                    default: false
                    type: boolean
                  labels:
                    default: false
                    type: boolean
                  protectedBranches:
                    default: false
                    type: boolean
                  repositoryRef:
                    description: |-
                      Template `ForgejoRepository` in the same namespace (must have
                      `isTemplate: true`).
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  topics:
                    default: false
                    type: boolean
                  webhooks:
                    default: false
                    type: boolean
                required:
                - repositoryRef
                type: object
              init:
                description: Creation-time initialization of an empty repository.
                nullable: true
                properties:
                  autoInit:
                    default: true
                    description: Create an initial commit (README, and the files below).
                    type: boolean
                  gitignores:
                    description: '`.gitignore` template names, comma-separated (e.g. `Rust,Node`).'
                    nullable: true
                    type: string
                  license:
                    description: License template name (e.g. `MIT`).
                    nullable: true
                    type: string
                  objectFormat:
                    description: '`sha1` (default) or `sha256`.'
                    nullable: true
                    type: string
                  readme:
                    description: README template name (`Default`).
                    nullable: true
                    type: string
                type: object
              instanceRef:
                nullable: true
                type: string
              isTemplate:
                default: false
                description: Mark the repository as a template others can be generated from.
                type: boolean
              migrate:
                description: |-
                  Migrate (or pull-mirror) a remote repository. Creation-time only,
                  except `mirrorInterval`, which stays in sync.
                nullable: true
                properties:
                  authSecretRef:
                    description: Credentials for the remote, from a `Secret` in this namespace.
                    nullable: true
                    properties:
                      name:
                        type: string
                      passwordKey:
                        nullable: true
                        type: string
                      tokenKey:
                        nullable: true
                        type: string
                      usernameKey:
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  cloneAddr:
                    description: URL to clone from.
                    type: string
                  issues:
                    default: false
                    type: boolean
                  labels:
                    default: false
                    type: boolean
                  lfs:
                    default: false
                    type: boolean
                  milestones:
                    default: false
                    type: boolean
                  mirror:
                    default: false
                    description: Keep the repository as a pull mirror of `cloneAddr`.
                    type: boolean
                  mirrorInterval:
                    description: |-
                      Pull-mirror sync interval, a Go duration (`8h`, `30m`). Kept in sync
                      after creation; `0` disables periodic sync.
                    nullable: true
                    type: string
                  pullRequests:
                    default: false
                    type: boolean
                  releases:
                    default: false
                    type: boolean
                  service:
                    default: git
                    description: |-
                      `git` (default), `github`, `gitea`, `gitlab`, `gogs`, `onedev`,
                      `gitbucket`, `codebase`, `forgejo` or `pagure`. Non-`git` services
                      can also bring issues, PRs, releases... (flags below).
                    type: string
                  wiki:
                    default: false
                    type: boolean
                required:
                - cloneAddr
                type: object
              name:
                description: |-
                  Repository name. Changing it renames in place (Forgejo keeps a
                  redirect from the old name). Changing the owner transfers the
                  repository, which needs the
                  `forgejo.weebo.io/allow-disruptive-update: "true"` annotation.
                type: string
              organizationRef:
                description: Owning `ForgejoOrganization` (cluster-scoped).
                nullable: true
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              private:
                default: false
                type: boolean
              teamRefs:
                description: |-
                  `ForgejoTeam`s granted access (organization-owned repositories only;
                  the teams must belong to the owning organization). Authoritative,
                  except for the `Owners` team and teams with
                  `includesAllRepositories`, which Forgejo always grants.
                items:
                  description: |-
                    Reference to another CR of this operator, by `metadata.name`. Always a
                    CR, never a raw Forgejo name (see `.prompt/plan.md`, "Références"): a
                    cluster-scoped target is looked up cluster-wide, a namespaced one in the
                    referencing CR's own namespace only.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              units:
                default: {}
                description: Repository units to enable or disable. Unset = Forgejo's default.
                properties:
                  actions:
                    nullable: true
                    type: boolean
                  issues:
                    nullable: true
                    type: boolean
                  packages:
                    nullable: true
                    type: boolean
                  projects:
                    nullable: true
                    type: boolean
                  pullRequests:
                    nullable: true
                    type: boolean
                  releases:
                    nullable: true
                    type: boolean
                  wiki:
                    nullable: true
                    type: boolean
                type: object
              userRef:
                description: Owning `ForgejoUser` (cluster-scoped).
                nullable: true
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              website:
                nullable: true
                type: string
            required:
            - name
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: |-
                        One of `domain::error::ReasonCode`'s `as_str()` values — never a
                        hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation (or the
                  RFC 3339 time, for `rotationPeriod`) the last secret was issued
                  for. Only used by kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: ForgejoRepository
        type: object
    served: true
    storage: true
    subresources:
      status: {}
