[tools]
cocogitto = "latest"
node = "24"
rust = { version = "latest", components = ["rust-src", "rustfmt", "llvm-tools", "clippy"], profile = "default" }
task = "latest"
gitleaks = "latest"
jq = "latest"
claude = "latest"
rtk = "latest"
uv = "latest"
"pipx:desloppify[full]" = "latest"
"pipx:graphifyy" = "latest"
# Forgejo client generation (spec/scripts/gen-client.sh): aqua ships
# openapi-generator as a bare jar, run through this JDK.
java = "temurin-25"
"aqua:OpenAPITools/openapi-generator" = "7.25.0"
# `task audit`
"aqua:EmbarkStudios/cargo-deny" = "latest"
# `task coverage` (needs rust's llvm-tools component, already listed)
"aqua:taiki-e/cargo-llvm-cov" = "latest"
trivy = "latest"
# envtest (crates/testkit): Go for its build-time bindings, and the real
# control-plane binaries it starts
go = "latest"
etcd = "3.5.32"
"aqua:kubernetes/kubernetes/kube-apiserver" = "1.36.2"
# The real-Vault live test (crates/adapters-inbound/tests/live_credentials.rs)
vault = "2.1.1"
# CI / container / chart linting and the kind e2e
actionlint = "latest"
# actionlint shells out to shellcheck for every `run:` script
shellcheck = "latest"
hadolint = "latest"
helm = "latest"
kubectl = "latest"
kind = "latest"
